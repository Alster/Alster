<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Andrii Khoma — Senior Backend Engineer and Day 404 vibe coder</title>
  <desc id="desc">A dark terminal-style banner combining professional backend experience, military service, and AI-era humor.</desc>
  <defs>
