<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Cognitive complexity versus task efficiency</title>
  <desc id="desc">A detailed brain becomes progressively smoother through active military service and AI agent delegation, while task completion remains high.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1018"/><stop offset="1" stop-color="#10131d"/>
    </linearGradient>
    <linearGradient id="brain" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fecaca"/><stop offset=".55" stop-color="#fb9a9a"/><stop offset="1" stop-color="#e87979"/>
    </linearGradient>
    <linearGradient id="smoothBrain" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe1e1"/><stop offset=".52" stop-color="#f5a3a3"/><stop offset="1" stop-color="#df7777"/>
    </linearGradient>
    <pattern id="pixelCamo" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#596346"/>
      <rect x="0" y="0" width="18" height="12" fill="#87906a"/>
      <rect x="18" y="0" width="12" height="20" fill="#3f4937"/>
      <rect x="30" y="0" width="18" height="9" fill="#a19b7a"/>
      <rect x="0" y="12" width="10" height="18" fill="#343c30"/>
      <rect x="10" y="12" width="22" height="12" fill="#6f7858"/>
      <rect x="32" y="9" width="16" height="20" fill="#4a543e"/>
      <rect x="0" y="30" width="20" height="18" fill="#8b886d"/>
      <rect x="20" y="24" width="11" height="24" fill="#30382d"/>
      <rect x="31" y="29" width="17" height="19" fill="#747d5b"/>
      <rect x="10" y="25" width="10" height="8" fill="#525d43"/>
      <rect x="31" y="20" width="8" height="9" fill="#9a9573"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>

  <rect width="1200" height="450" rx="24" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="42" y="43" fill="#f8fafc" font-size="21" font-weight="800">COGNITIVE COMPLEXITY vs TASK EFFICIENCY</text>
    <text x="42" y="68" fill="#64748b" font-size="14">A highly scientific career progression model</text>

    <!-- Stage 1 -->
    <g transform="translate(34 89)">
      <rect width="348" height="230" rx="18" fill="#102b39" stroke="#2dd4bf" stroke-opacity=".42"/>
      <text x="22" y="32" fill="#5eead4" font-size="12" font-weight="800" letter-spacing="2">BEFORE</text>
      <g transform="translate(22 49)" filter="url(#shadow)">
        <path d="M14 69C2 56 6 34 21 28C21 13 40 4 55 13C66 1 89 7 92 24C108 29 113 49 102 61C101 76 82 84 68 75C53 85 32 80 28 70C23 72 18 72 14 69Z" fill="url(#brain)" stroke="#fecaca" stroke-width="2"/>
        <g fill="none" stroke="#b94f5b" stroke-width="3" stroke-linecap="round" opacity=".82">
          <path d="M25 29c13 2 12 13 4 18s-4 17 8 18"/>
          <path d="M46 16c-7 8-4 17 5 20s10 13 2 21-4 17 7 20"/>
          <path d="M69 13c8 8 7 17-1 23s-6 15 4 20 10 13 1 21"/>
          <path d="M90 27c-12 1-14 11-7 17s6 16-5 21"/>
          <path d="M18 53c10-4 18 1 20 10"/>
          <path d="M64 45c12-5 22 0 25 10"/>
        </g>
      </g>
      <text x="151" y="80" fill="#f8fafc" font-size="21" font-weight="750">Senior engineer</text>
      <text x="151" y="106" fill="#94a3b8" font-size="14">Thinks before acting</text>
      <text x="22" y="162" fill="#cbd5e1" font-size="15">Carefully spent a decade</text>
      <text x="22" y="184" fill="#cbd5e1" font-size="15">becoming good at one profession.</text>
      <text x="22" y="214" fill="#5eead4" font-size="13" font-weight="800">COGNITIVE AUTONOMY: 100%</text>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(426 89)">
      <rect width="348" height="230" rx="18" fill="#17251b" stroke="#84cc16" stroke-opacity=".52"/>
      <path d="M0 18A18 18 0 0 1 18 0h312a18 18 0 0 1 18 18v27H0Z" fill="url(#pixelCamo)"/>
      <rect width="348" height="45" rx="18" fill="#0b130c" opacity=".35"/>
      <text x="22" y="30" fill="#f7fee7" font-size="12" font-weight="800" letter-spacing="2">ACTIVE MILITARY SERVICE</text>
      <g transform="translate(22 55)" filter="url(#shadow)">
        <path d="M10 51C10 27 29 10 57 9C87 7 108 25 109 50C110 73 92 82 63 80C34 84 10 75 10 51Z" fill="url(#brain)" stroke="#fecaca" stroke-width="2"/>
        <g fill="none" stroke="#b94f5b" stroke-width="3" stroke-linecap="round" opacity=".72">
          <path d="M37 22c-9 10-5 21 4 26s8 16-1 24"/>
          <path d="M74 17c8 8 6 18-2 24s-4 17 7 23"/>
          <path d="M23 55c15-5 24 2 26 13"/>
        </g>
      </g>
      <text x="151" y="84" fill="#f8fafc" font-size="20" font-weight="750">Order executor</text>
      <text x="151" y="109" fill="#94a3b8" font-size="14">Thinks when instructed</text>
      <text x="22" y="166" fill="#cbd5e1" font-size="15">Stands by. Accepts any task.</text>
      <text x="22" y="188" fill="#cbd5e1" font-size="15">Unrelated skills keep loading.</text>
      <text x="22" y="214" fill="#a3e635" font-size="13" font-weight="800">COGNITIVE AUTONOMY: ON COMMAND</text>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(818 89)">
      <rect width="348" height="230" rx="18" fill="#281c40" stroke="#c084fc" stroke-opacity=".50"/>
      <text x="22" y="32" fill="#d8b4fe" font-size="12" font-weight="800" letter-spacing="2">AI-ERA WORKFLOW</text>
      <g transform="translate(22 49)" filter="url(#shadow)">
        <ellipse cx="60" cy="46" rx="53" ry="39" fill="url(#smoothBrain)" stroke="#ffe4e6" stroke-width="2"/>
        <path d="M27 27c16-16 48-19 67-2" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".32"/>
      </g>
      <text x="151" y="80" fill="#f8fafc" font-size="20" font-weight="750">Agent supervisor</text>
      <text x="151" y="106" fill="#94a3b8" font-size="14">Delegates thinking</text>
      <text x="22" y="162" fill="#cbd5e1" font-size="15">Prompts. Watches thoughtfully.</text>
      <text x="22" y="184" fill="#cbd5e1" font-size="15">Occasionally nods.</text>
      <text x="22" y="214" fill="#d8b4fe" font-size="13" font-weight="800">COGNITIVE AUTONOMY: DELEGATED</text>
    </g>

    <!-- Arrows -->
    <path d="M390 204h24" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="m406 196 9 8-9 8" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M782 204h24" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="m798 196 9 8-9 8" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Constant throughput -->
    <text x="42" y="359" fill="#94a3b8" font-size="13" font-weight="700" letter-spacing="1.5">TASK COMPLETION EFFICIENCY</text>
    <rect x="42" y="377" width="1124" height="38" rx="19" fill="#0c1d16" stroke="#22c55e" stroke-opacity=".45"/>
    <rect x="47" y="382" width="1114" height="28" rx="14" fill="#16a34a" fill-opacity=".24"/>
    <circle cx="202" cy="396" r="7" fill="#4ade80"/>
    <circle cx="600" cy="396" r="7" fill="#4ade80"/>
    <circle cx="998" cy="396" r="7" fill="#4ade80"/>
    <path d="M202 396H998" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
    <text x="202" y="401" text-anchor="middle" fill="#052e16" font-size="10" font-weight="900">✓</text>
    <text x="600" y="401" text-anchor="middle" fill="#052e16" font-size="10" font-weight="900">✓</text>
    <text x="998" y="401" text-anchor="middle" fill="#052e16" font-size="10" font-weight="900">✓</text>
    <text x="1122" y="401" text-anchor="end" fill="#86efac" font-size="14" font-weight="800">STILL HIGH</text>
    <text x="600" y="438" text-anchor="middle" fill="#64748b" font-size="13">Less thinking. Same throughput. Optimization achieved.</text>
  </g>
</svg>
